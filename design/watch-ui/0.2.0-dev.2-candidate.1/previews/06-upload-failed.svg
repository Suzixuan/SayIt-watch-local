<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs><clipPath id="round"><circle cx="240" cy="240" r="240"/></clipPath></defs>
  <g clip-path="url(#round)">
    <rect width="480" height="480" fill="#101418"/>
    <text x="240" y="46" fill="#7f95a8" font-family="monospace" font-size="17" text-anchor="middle">10:10</text>
    <text x="240" y="120" fill="#e8edf2" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">Upload failed</text>
    <text x="240" y="152" fill="#ff8a80" font-family="monospace" font-size="15" text-anchor="middle">HTTP 409 (PC busy)</text>
    <text x="240" y="180" fill="#7f95a8" font-family="monospace" font-size="13" text-anchor="middle">The recording is kept.</text>
    <text x="240" y="200" fill="#7f95a8" font-family="monospace" font-size="13" text-anchor="middle">Retry resends it — no re-recording.</text>
    <rect x="75" y="240" width="140" height="52" rx="26" fill="#1d3a5f" stroke="#3d6a9e" stroke-width="2"/>
    <text x="145" y="273" fill="#d7e3f0" font-family="monospace" font-size="19" text-anchor="middle">Retry</text>
    <rect x="265" y="240" width="140" height="52" rx="26" fill="#333c44" stroke="#5a6a78" stroke-width="2"/>
    <text x="335" y="273" fill="#d7e3f0" font-family="monospace" font-size="19" text-anchor="middle">Later</text>
  </g>
  <circle cx="240" cy="240" r="238" fill="none" stroke="#2a3440" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs><clipPath id="round"><circle cx="240" cy="240" r="240"/></clipPath></defs>
  <g clip-path="url(#round)">
    <rect width="480" height="480" fill="#101418"/>
    <text x="240" y="46" fill="#7f95a8" font-family="monospace" font-size="17" text-anchor="middle">10:10</text>
    <text x="240" y="96" fill="#e8edf2" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">SayIt Watch · Setup</text>
    <text x="240" y="140" fill="#7f95a8" font-family="monospace" font-size="12" text-anchor="middle">PC IP (RFC1918)</text>
    <text x="240" y="162" fill="#d7e3f0" font-family="monospace" font-size="15" text-anchor="middle">192.168.x.x</text>
    <text x="240" y="190" fill="#7f95a8" font-family="monospace" font-size="12" text-anchor="middle">Port</text>
    <text x="240" y="212" fill="#d7e3f0" font-family="monospace" font-size="15" text-anchor="middle">&lt;PORT&gt;</text>
    <text x="240" y="240" fill="#7f95a8" font-family="monospace" font-size="12" text-anchor="middle">Dev Token (64 hex)</text>
    <text x="240" y="262" fill="#d7e3f0" font-family="monospace" font-size="15" text-anchor="middle">A1B2••••••••7890</text>
    <rect x="40" y="292" width="400" height="52" rx="26" fill="#1d3a5f" stroke="#3d6a9e" stroke-width="2"/>
    <text x="240" y="324" fill="#d7e3f0" font-family="monospace" font-size="15" text-anchor="middle">Save &amp; Apply</text>
    <text x="240" y="376" fill="#66788a" font-family="monospace" font-size="12" text-anchor="middle">Needs a valid RFC1918 IP, port</text>
    <text x="240" y="396" fill="#66788a" font-family="monospace" font-size="12" text-anchor="middle">and 64-hex token.</text>
  </g>
  <circle cx="240" cy="240" r="238" fill="none" stroke="#2a3440" stroke-width="2"/>

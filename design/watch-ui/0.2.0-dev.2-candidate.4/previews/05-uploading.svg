<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs><clipPath id="round"><circle cx="240" cy="240" r="240"/></clipPath></defs>
  <g clip-path="url(#round)">
    <!-- candidate.4 必修 2: the overlay uses a FULLY OPAQUE background + solid
         content panel — no underlying Ready text, controls, or TimeText shows
         through, so no glyphs overlap at any size. -->
    <rect width="480" height="480" fill="#101418"/>
    <rect x="28" y="140" width="424" height="200" rx="24" fill="#1c242e"/>
    <text x="240" y="196" fill="#e8edf2" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">Uploading…</text>
    <text x="240" y="244" fill="#9fb3c8" font-family="monospace" font-size="14" text-anchor="middle">Sending the recording to the PC.</text>
    <text x="240" y="268" fill="#9fb3c8" font-family="monospace" font-size="14" text-anchor="middle">The screen stays awake automatically.</text>
  </g>
  <circle cx="240" cy="240" r="238" fill="none" stroke="#2a3440" stroke-width="2"/>
  <!-- candidate.4: element-for-element render of the Compose screens at the nominal 1dp=1px reference scale -->
</svg>

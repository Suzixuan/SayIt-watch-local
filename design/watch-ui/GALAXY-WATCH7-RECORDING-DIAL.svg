<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- Samsung Galaxy Watch 7 circular recording UI concept — 2 dials side by side.
       Transparent background. No Wifi/battery icons, no status bar, no buttons. -->

  <defs>
    <!-- minute tick: long, thin, gray. Drawn at 12 o'clock from (0,-R) inward. -->
    <line id="mtick" x1="0" y1="-150" x2="0" y2="-137" stroke="#97A1AC" stroke-width="1.4" stroke-linecap="round"/>
    <!-- major tick (12/3/6/9): shorter, thicker, bright blue. -->
    <line id="mtick-major" x1="0" y1="-150" x2="0" y2="-143" stroke="#1976E9" stroke-width="3.4" stroke-linecap="round"/>

    <!-- Reusable dial: white face + full tick ring in a safe circle, centered on (0,0). -->
    <g id="dial">
      <circle r="150" fill="#F7F8FA"/>
      <!-- 60 minute ticks -->
      <g>
        <use href="#mtick" transform="rotate(0)"/>
        <use href="#mtick" transform="rotate(6)"/>
        <use href="#mtick" transform="rotate(12)"/>
        <use href="#mtick" transform="rotate(18)"/>
        <use href="#mtick" transform="rotate(24)"/>
        <use href="#mtick" transform="rotate(30)"/>
        <use href="#mtick" transform="rotate(36)"/>
        <use href="#mtick" transform="rotate(42)"/>
        <use href="#mtick" transform="rotate(48)"/>
        <use href="#mtick" transform="rotate(54)"/>
        <use href="#mtick" transform="rotate(60)"/>
        <use href="#mtick" transform="rotate(66)"/>
        <use href="#mtick" transform="rotate(72)"/>
        <use href="#mtick" transform="rotate(78)"/>
        <use href="#mtick" transform="rotate(84)"/>
        <use href="#mtick" transform="rotate(90)"/>
        <use href="#mtick" transform="rotate(96)"/>
        <use href="#mtick" transform="rotate(102)"/>
        <use href="#mtick" transform="rotate(108)"/>
        <use href="#mtick" transform="rotate(114)"/>
        <use href="#mtick" transform="rotate(120)"/>
        <use href="#mtick" transform="rotate(126)"/>
        <use href="#mtick" transform="rotate(132)"/>
        <use href="#mtick" transform="rotate(138)"/>
        <use href="#mtick" transform="rotate(144)"/>
        <use href="#mtick" transform="rotate(150)"/>
        <use href="#mtick" transform="rotate(156)"/>
        <use href="#mtick" transform="rotate(162)"/>
        <use href="#mtick" transform="rotate(168)"/>
        <use href="#mtick" transform="rotate(174)"/>
        <use href="#mtick" transform="rotate(180)"/>
        <use href="#mtick" transform="rotate(186)"/>
        <use href="#mtick" transform="rotate(192)"/>
        <use href="#mtick" transform="rotate(198)"/>
        <use href="#mtick" transform="rotate(204)"/>
        <use href="#mtick" transform="rotate(210)"/>
        <use href="#mtick" transform="rotate(216)"/>
        <use href="#mtick" transform="rotate(222)"/>
        <use href="#mtick" transform="rotate(228)"/>
        <use href="#mtick" transform="rotate(234)"/>
        <use href="#mtick" transform="rotate(240)"/>
        <use href="#mtick" transform="rotate(246)"/>
        <use href="#mtick" transform="rotate(252)"/>
        <use href="#mtick" transform="rotate(258)"/>
        <use href="#mtick" transform="rotate(264)"/>
        <use href="#mtick" transform="rotate(270)"/>
        <use href="#mtick" transform="rotate(276)"/>
        <use href="#mtick" transform="rotate(282)"/>
        <use href="#mtick" transform="rotate(288)"/>
        <use href="#mtick" transform="rotate(294)"/>
        <use href="#mtick" transform="rotate(300)"/>
        <use href="#mtick" transform="rotate(306)"/>
        <use href="#mtick" transform="rotate(312)"/>
        <use href="#mtick" transform="rotate(318)"/>
        <use href="#mtick" transform="rotate(324)"/>
        <use href="#mtick" transform="rotate(330)"/>
        <use href="#mtick" transform="rotate(336)"/>
        <use href="#mtick" transform="rotate(342)"/>
        <use href="#mtick" transform="rotate(348)"/>
        <use href="#mtick" transform="rotate(354)"/>
      </g>
      <!-- 4 major blue ticks: 12 / 3 / 6 / 9 o'clock -->
      <use href="#mtick-major" transform="rotate(0)"/>
      <use href="#mtick-major" transform="rotate(90)"/>
      <use href="#mtick-major" transform="rotate(180)"/>
      <use href="#mtick-major" transform="rotate(270)"/>
      <!-- soft inner safe-zone rim to keep content from touching the ticks -->
      <circle r="132" fill="none" stroke="#ECEEF1" stroke-width="0"/>
    </g>
  </defs>

  <!-- ══════════════════ LEFT — MIC READY ══════════════════ -->
  <g transform="translate(210,190)">
    <use href="#dial"/>
    <!-- Title: centered, upper area (~28% above center), small, tracked uppercase -->
    <text x="0" y="-82" text-anchor="middle" fill="#2A2E33" font-size="16" font-weight="600" letter-spacing="2.5">MIC READY</text>
    <!-- Line microphone, dark gray-near-black, large, slightly below center -->
    <g stroke="#2A2E33" stroke-width="4" stroke-linecap="round" fill="none">
      <rect x="-10" y="-22" width="20" height="30" rx="10"/>
      <path d="M-18 6 A18 18 0 0 0 18 6"/>
      <line x1="0" y1="24" x2="0" y2="38"/>
      <line x1="-10" y1="38" x2="10" y2="38"/>
    </g>
  </g>

  <!-- ══════════════════ RIGHT — RECORDING ══════════════════ -->
  <g transform="translate(550,190)">
    <use href="#dial"/>
    <!-- Title -->
    <text x="0" y="-82" text-anchor="middle" fill="#2A2E33" font-size="16" font-weight="600" letter-spacing="2.5">RECORDING</text>
    <!-- Symmetric hollow waveform, center tallest tapering to sides -->
    <g stroke="#1976E9" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="-60" y1="0"  x2="-60" y2="-8"/>
      <line x1="-48" y1="0"  x2="-48" y2="-16"/>
      <line x1="-36" y1="0"  x2="-36" y2="-24"/>
      <line x1="-24" y1="0"  x2="-24" y2="-30"/>
      <line x1="-12" y1="0"  x2="-12" y2="-34"/>
      <line x1="0"   y1="0"  x2="0"   y2="-38"/>
      <line x1="12"  y1="0"  x2="12"  y2="-34"/>
      <line x1="24"  y1="0"  x2="24"  y2="-30"/>
      <line x1="36"  y1="0"  x2="36"  y2="-24"/>
      <line x1="48"  y1="0"  x2="48"  y2="-16"/>
      <line x1="60"  y1="0"  x2="60"  y2="-8"/>
    </g>
    <!-- Timer: below the waveform (~20% below center), larger than title, dark gray -->
    <text x="0" y="64" text-anchor="middle" fill="#2A2E33" font-size="30" font-weight="600" letter-spacing="1">00:09.0</text>
  </g>
</svg>

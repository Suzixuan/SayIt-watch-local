[package]
name = "spike-binary-ipc"
version = "0.1.0"
edition = "2021"
description = "Z2 isolated Tauri v2 binary-IPC runtime proof. Not SayIt product code."

[lib]
name = "spike_binary_ipc_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to the exact stack the accepted Z1 contract cites (see the contract §B.4 evidence).
tauri = { version = "=2.10.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
